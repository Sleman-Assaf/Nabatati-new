
     <body class=" mb-3">

    



<div class="header ">
        <div class="profile-info">
        <h1 class="name">{{Fname}}<br>{{Lname}}</h1>
            <div class="title-box">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>

            <a href="#contact" class="cta-button">Chat With Me!</a>

                </a>
                <a href="#" class="social-icon" aria-label="LinkedIn">

                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>

        <div class="profile-image-container d-flex flex-column">
            <img [src]="EngCvImgUrl" alt="pic hamza algmzawe " class="profile-image">
            <a href="#connect" class="connect-button">Let's Connect</a>
            <div class="testimonial">
                Im, Available
            </div>
           


  <div class="social-icons d-flex justify-content-center align-items-center marginarrow">
                <a href="#" data-bs-target="#carouselExample" data-bs-slide="prev" class="social-icon me-3" aria-label="Facebook">
                   <i class="fa-solid fa-arrow-left me-"></i>
                </a>
                <a href="#" data-bs-target="#carouselExample" data-bs-slide="next" class="social-icon me-5" aria-label="Twitter">
                     <i class="fa-solid fa-arrow-right"></i>
                </a>
               
            </div>
        


        </div>
